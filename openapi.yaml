openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
servers:
  - url: http://localhost:4010
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      description: Returns every task.
      responses:
        "400":
          description: The query is invalid.
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      summary: Create a task
      description: Creates a task from a title and returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTask"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: The request body is invalid, for example the title is missing.
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get a task
      description: Returns one task by its ID.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task has this ID.
components:
  schemas:
    NewTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        done:
          type: boolean
