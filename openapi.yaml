openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
servers:
  - url: http://localhost:4010
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      description: Returns all tasks as an array. The array is empty when no tasks exist.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          description: The request was malformed and could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTask
      summary: Create a task
      description: Creates a task from the supplied title and returns the created task, including its generated id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTask"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: The request body is invalid, for example `title` is missing or not a string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get a task
      description: Returns a single task by its id.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Identifier of the task to retrieve.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task exists with the given `taskId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Permanently deletes a single task by its id. Returns no content on success.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Identifier of the task to delete.
          schema:
            type: string
      responses:
        "204":
          description: The task was deleted. The response has no body.
        "404":
          description: No task exists with the given `taskId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable explanation of what went wrong.
    NewTask:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        done:
          type: boolean
